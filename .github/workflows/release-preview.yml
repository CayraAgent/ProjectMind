name: Release preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - run: pnpm pack:repro
      - run: node scripts/package-smoke.mjs artifacts/projectmind-preview-a.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: projectmind-release-preview
          path: artifacts/projectmind-preview-a.tgz
          if-no-files-found: error
