name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm pack:repro
      - run: node scripts/package-smoke.mjs artifacts/projectmind-preview-a.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: projectmind-package-${{ github.sha }}
          path: artifacts/projectmind-preview-a.tgz
          if-no-files-found: error
  platform:
    name: platform (${{ matrix.os }})
    needs: validate
    strategy:
      matrix:
        include:
          - os: macos-15
            command: pnpm validate
          - os: windows-2025
            command: pnpm validate:windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ${{ matrix.command }}
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./
        id: untrusted
        continue-on-error: true
        with:
          working-directory: examples/basic-ts
          intent-id: PM-0001
          proofpack-artifact-name: projectmind-proofpack-untrusted
      - name: Require the default trust gate to block execution
        if: steps.untrusted.outcome != 'failure'
        run: exit 1
      - run: |
          cd examples/basic-ts
          git init -q
          git config user.name 'ProjectMind CI'
          git config user.email 'ci@example.com'
          git add .
          git commit -qm 'demo fixture'
      - uses: ./
        with:
          working-directory: examples/basic-ts
          trust-repository-code: 'true'
          intent-id: PM-0001
      - name: Require a generated ProofPack
        run: test -n "$(find examples/basic-ts/.projectmind/proofs -maxdepth 1 -name '*.json' -print -quit)"
