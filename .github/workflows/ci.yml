name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - run: pnpm pack:check
      - run: node scripts/package-smoke.mjs ../projectmind-preview.tgz
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          cd examples/basic-ts
          git init -q
          git config user.name 'ProjectMind CI'
          git config user.email 'ci@example.com'
          git add .
          git commit -qm 'demo fixture'
      - uses: ./
        with:
          working-directory: examples/basic-ts
          trust-repository-code: 'true'
          intent-id: PM-0001
