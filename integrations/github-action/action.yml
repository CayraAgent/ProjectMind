name: ProjectMind Verify
description: Verify the current repository change with ProjectMind
author: ProjectMind contributors
inputs:
  intent-id:
    description: Optional ProjectMind intent id. Defaults to current intent.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        node --experimental-strip-types "${{ github.action_path }}/../../apps/cli/src/index.ts" scan
        node --experimental-strip-types "${{ github.action_path }}/../../apps/cli/src/index.ts" verify ${{ inputs.intent-id }}
branding:
  icon: check-circle
  color: gray-dark
